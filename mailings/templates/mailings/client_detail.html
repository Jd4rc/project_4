{% extends 'base.html' %}

{% block title %}{{ client.full_name }} — получатель{% endblock %}

{% block content %}
    <h1 class="h3 mb-3">{{ client.full_name }}</h1>

    <dl class="row">
        <dt class="col-sm-3">Email</dt>
        <dd class="col-sm-9">{{ client.email }}</dd>

        <dt class="col-sm-3">Комментарий</dt>
        <dd class="col-sm-9">{{ client.comment|default:"—"|linebreaksbr }}</dd>
    </dl>

    <a class="btn btn-outline-secondary" href="{% url 'mailings:client_update' client.pk %}">Редактировать</a>
    <a class="btn btn-outline-danger" href="{% url 'mailings:client_delete' client.pk %}">Удалить</a>
    <a class="btn btn-link" href="{% url 'mailings:client_list' %}">К списку</a>
{% endblock %}
