{% extends 'base.html' %}

{% block title %}Новый пароль{% endblock %}

{% block content %}
    <div class="col-md-6 col-lg-5">
        <h1 class="h3 mb-3">Новый пароль</h1>
        {% if validlink %}
            <form method="post" novalidate>
                {% csrf_token %}
                {% include 'users/includes/form_fields.html' %}
                <button class="btn btn-primary" type="submit">Сохранить пароль</button>
            </form>
        {% else %}
            <p>Ссылка недействительна или уже использована.</p>
            <a href="{% url 'users:password_reset' %}">Запросить новую</a>
        {% endif %}
    </div>
{% endblock %}
