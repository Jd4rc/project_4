{% extends 'base.html' %}

{% block title %}Восстановление пароля{% endblock %}

{% block content %}
    <div class="col-md-6 col-lg-5">
        <h1 class="h3 mb-3">Восстановление пароля</h1>
        <p>Укажите email, с которым регистрировались, — пришлём ссылку для нового пароля.</p>
        <form method="post" novalidate>
            {% csrf_token %}
            {% include 'users/includes/form_fields.html' %}
            <button class="btn btn-primary" type="submit">Отправить ссылку</button>
            <a class="btn btn-link" href="{% url 'users:login' %}">Отмена</a>
        </form>
    </div>
{% endblock %}
