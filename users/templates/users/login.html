{% extends 'base.html' %}

{% block title %}Вход{% endblock %}

{% block content %}
    <div class="col-md-6 col-lg-5">
        <h1 class="h3 mb-3">Вход</h1>
        <form method="post" novalidate>
            {% csrf_token %}
            {% include 'users/includes/form_fields.html' %}
            <input type="hidden" name="next" value="{{ next }}">
            <button class="btn btn-primary" type="submit">Войти</button>
            <a class="btn btn-link" href="{% url 'users:password_reset' %}">Забыли пароль?</a>
        </form>
        <p class="mt-3">Нет аккаунта? <a href="{% url 'users:register' %}">Регистрация</a></p>
    </div>
{% endblock %}
